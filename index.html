<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayDOD | Reducing Returns</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#030712] text-slate-200 antialiased selection:bg-blue-600 selection:text-white min-h-screen flex flex-col items-center justify-between py-16 px-6">

    <!-- Top Spacing -->
    <div></div>

    <!-- Centered Minimal Hero -->
    <main class="flex flex-col items-center text-center max-w-md mx-auto space-y-6">
        <!-- Logo & Brand Name -->
        <div class="flex flex-col items-center space-y-4">
            <img src="logo.png" alt="PayDOD Logo" class="w-24 h-24 sm:w-28 sm:h-28 rounded-2xl object-cover bg-[#030712] border border-slate-800/80 p-1.5 shadow-2xl shadow-blue-950/30" onerror="this.style.display='none'">
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">Pay<span class="text-blue-500">DOD</span></h1>
        </div>

        <!-- Tagline -->
        <p class="text-xs sm:text-sm tracking-[0.25em] text-slate-400 uppercase font-medium">
            Reducing Returns
        </p>

        <!-- Action Buttons -->
        <div class="flex flex-col items-center gap-3 pt-4 w-full">
            <a href="https://calendly.com/orderping-demo/orderping-demo" target="_blank" class="w-full px-8 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm transition shadow-lg shadow-blue-600/25 text-center">
                Schedule Demo
            </a>
            <a href="mailto:ahmed@paydod.online" class="w-full px-8 py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-800 font-medium text-sm transition text-center">
                ahmed@paydod.online
            </a>
        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="text-center text-xs text-slate-600 pt-8">
        &copy; 2026 PayDOD &bull; Ahmed Nouman
    </footer>

</body>
</html>
